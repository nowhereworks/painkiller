---
# Inventory is built exclusively from create-lab.sh's ownership-checked status.
- name: Build API load balancer inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate the five-node HA topology
      ansible.builtin.assert:
        that:
          - controller_ips.split(',') | length == 3
          - worker_ips.split(',') | length == 2
          - api_vip == '192.168.254.80'
    - name: Add the owned workers
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: api_balancers
        ansible_connection: ssh
        ansible_user: "{{ ssh_user }}"
        ansible_become: true
        peer: "{{ worker_ips.split(',') | reject('equalto', item) | first }}"
        priority: "{{ 110 - (index * 10) }}"
      loop: "{{ worker_ips.split(',') }}"
      loop_control:
        index_var: index

- name: Configure redundant API endpoint on lab workers
  hosts: api_balancers
  become: true
  gather_facts: true
  tasks:
    - name: Discover the guest interface for the reserved VIP
      ansible.builtin.command: ip -j route get {{ api_vip }}
      register: vip_route
      changed_when: false
    - name: Record the directly connected guest interface
      ansible.builtin.set_fact:
        vip_interface: "{{ (vip_route.stdout | from_json)[0].dev }}"
    - name: Require a directly connected route and matching guest source
      ansible.builtin.assert:
        that:
          - (vip_route.stdout | from_json)[0].gateway is not defined
          - (vip_route.stdout | from_json)[0].prefsrc == inventory_hostname
          - vip_interface is match('^[a-zA-Z0-9_.-]+$')
        fail_msg: "Reserved VIP is not on this guest's directly connected subnet."
    - name: Install API balancing packages
      ansible.builtin.apt:
        name: [haproxy, keepalived]
        state: present
        update_cache: true
    - name: Configure TCP health-checked API backends
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
        validate: /usr/sbin/haproxy -c -f %s
        content: |
          global
            log /dev/log local0
            user haproxy
            group haproxy
            daemon
          defaults
            mode tcp
            timeout connect 3s
            timeout client 60s
            timeout server 60s
          frontend kube_api
            bind *:8443
            default_backend controllers
          backend controllers
            balance roundrobin
            option tcp-check
          {% for ip in controller_ips.split(',') %}
            server cp{{ loop.index }} {{ ip }}:6443 check inter 2s fall 2 rise 2
          {% endfor %}
      notify: Restart HAProxy
    - name: Install local HAProxy process check
      ansible.builtin.copy:
        dest: /usr/local/sbin/painkiller-check-haproxy
        mode: "0755"
        content: |
          #!/bin/sh
          exec /usr/bin/systemctl is-active --quiet haproxy
    - name: Configure owned-guest unicast VRRP
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        mode: "0600"
        content: |
          global_defs {
            enable_script_security
            script_user root
          }
          vrrp_script check_haproxy {
            script "/usr/local/sbin/painkiller-check-haproxy"
            interval 2
            fall 2
            rise 2
          }
          vrrp_instance PAINKILLER_API {
            state BACKUP
            interface {{ vip_interface }}
            virtual_router_id 80
            priority {{ priority }}
            advert_int 1
            unicast_src_ip {{ inventory_hostname }}
            unicast_peer {
              {{ peer }}
            }
            virtual_ipaddress {
              {{ api_vip }}/32 dev {{ vip_interface }}
            }
            track_script {
              check_haproxy
            }
          }
      notify: Restart Keepalived
    - name: Apply configuration before checking services
      ansible.builtin.meta: flush_handlers
    - name: Enable and start balancing services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [haproxy, keepalived]
  handlers:
    - name: Restart HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
    - name: Restart Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: restarted
