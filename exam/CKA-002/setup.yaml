# CKA-002 fixtures and intentional faults. Applied by prepare.sh after the
# cluster bootstrap and dependency installation, before node-level faults.
# Namespaces carry the exam marker so reference solutions can refuse a foreign
# cluster. Faults are declared last so the rest of the exam still functions.
apiVersion: v1
kind: Namespace
metadata:
  name: exam-workloads
  labels:
    painkiller-shell/exam: "true"
    painkiller-shell/exam-id: "CKA-002"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-rbac
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-helm
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-ops
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-netpol
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-gw
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-gw-backend
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-ingress
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-lb
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-storage
  labels:
    painkiller-shell/exam: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-repair
  labels:
    painkiller-shell/exam: "true"
---
# Task 2: drain target with a PodDisruptionBudget.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: exam-workloads
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: exam-workloads
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web
---
# Task 3: RBAC fixtures.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: exam-rbac
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: exam-rbac
  labels:
    app: rbac-app
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Secret
metadata:
  name: credentials
  namespace: exam-rbac
stringData:
  username: operator
---
# Task 6: failed rollout with an unpullable image and no probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: exam-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: nginx:9.9.9
---
# Task 7: HPA target plus ConfigMap/Secret to consume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: exam-workloads
data:
  mode: production
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: exam-workloads
stringData:
  password: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-web
  namespace: exam-workloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-web
  template:
    metadata:
      labels:
        app: hpa-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
# Task 9: NetworkPolicy isolation fixtures.
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: exam-netpol
  labels:
    app: db
spec:
  containers:
    - name: db
