# One exam-owned controller serves both Gateway API and Ingress.
apiVersion: v1
kind: ServiceAccount
metadata: {name: routing, namespace: cka003-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cka003-routing}
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes, namespaces, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tlsroutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status, grpcroutes/status, tlsroutes/status, referencegrants/status, backendtlspolicies/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cka003-routing}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cka003-routing}
subjects: [{kind: ServiceAccount, name: routing, namespace: cka003-system}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: routing, namespace: cka003-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: cka003-routing}}
  template:
    metadata: {labels: {app: cka003-routing}}
    spec:
      serviceAccountName: routing
      containers:
        - name: traefik
          image: traefik:v3.7.19
          args:
            - --entrypoints.web.address=:80
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=nginx-cka04
            - --providers.kubernetesgateway
          ports: [{name: web, containerPort: 80}]
          readinessProbe: {tcpSocket: {port: web}}
---
apiVersion: v1
kind: Service
metadata: {name: routing, namespace: cka003-system}
spec:
  type: NodePort
  selector: {app: cka003-routing}
  ports: [{name: web, port: 80, targetPort: web, nodePort: 30080}]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: nginx-cka04}
spec: {controller: traefik.io/ingress-controller}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: cka003}
spec: {controllerName: traefik.io/gateway-controller}
