apiVersion: v1
kind: Namespace
metadata:
  name: cka003-system
  labels: {painkiller-shell/exam: CKA-003}
---
apiVersion: v1
kind: Namespace
metadata: {name: gateway-lab}
---
apiVersion: v1
kind: Namespace
metadata: {name: release-lab}
---
apiVersion: v1
kind: Namespace
metadata: {name: catalog-repair}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: namespace-observer, namespace: default}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: namespace-observer-role}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: namespace-observer-binding}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: namespace-observer-role}
subjects:
  - {kind: ServiceAccount, name: namespace-observer, namespace: default}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: quay-frontend, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: catalog-quota, namespace: catalog-repair}
spec: {hard: {pods: "2"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-api, namespace: catalog-repair}
spec:
  replicas: 3
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers: [{name: web, image: "nginx:1.27"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: portal-backend, namespace: gateway-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: portal-backend}}
  template:
    metadata: {labels: {app: portal-backend}}
    spec:
      containers: [{name: web, image: "nginx:1.27", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: portal-service, namespace: gateway-lab}
spec:
  selector: {app: portal-backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: portal-gateway, namespace: gateway-lab}
spec:
  gatewayClassName: cka003
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      hostname: practice-controller
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: v1
kind: Pod
metadata: {name: queued-web, namespace: default}
spec:
  nodeSelector: {cka003/placement: misspelled}
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  containers: [{name: web, image: "nginx:1.27"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory-api, namespace: release-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-api}}
  template:
    metadata: {labels: {app: inventory-api}}
    spec:
      containers: [{name: web, image: "nginx:1.27"}]
---
apiVersion: v1
kind: Secret
metadata: {name: ledger-credentials, namespace: default}
type: Opaque
stringData:
  admin-password: practice-root
  db-name: practice
  db-user: practice-user
  db-password: practice-password
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-db, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger-db}}
  template:
    metadata: {labels: {app: ledger-db}}
    spec:
      containers:
        - name: db
          image: busybox:1.37
          command: [sh, -c]
          args:
            - 'test "$DB_ROOT_PASSWORD" = practice-root && test "$DB_DATABASE" = practice && test "$DB_USER" = practice-user && test "$DB_PASSWORD" = practice-password && exec sleep 2147483647'
          env:
            - {name: DB_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: ledger-credentials, key: wrong-root}}}
            - {name: DB_DATABASE, valueFrom: {secretKeyRef: {name: ledger-credentials, key: wrong-database}}}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: ledger-credentials, key: wrong-user}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: ledger-credentials, key: wrong-password}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: site-backend, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: site-backend}}
  template:
    metadata: {labels: {app: site-backend}}
    spec:
      containers: [{name: web, image: "nginx:1.27"}]
---
apiVersion: v1
kind: Service
metadata: {name: site-service, namespace: default}
spec:
  selector: {app: site-backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reports-api, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      containers: [{name: web, image: "nginx:1.27"}]
---
apiVersion: v1
kind: Pod
metadata: {name: status-web, namespace: default, labels: {app: status}}
spec:
  containers: [{name: web, image: "nginx:1.27", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: status-service, namespace: default}
spec:
  selector: {app: status}
  ports: [{port: 8080, targetPort: 81}]
---
apiVersion: v1
kind: Pod
metadata: {name: status-monitor, namespace: default}
spec:
  containers:
    - name: monitor
      image: curlimages/curl:8.12.1
      command: [sh, -c]
      args: ["while true; do curl --connect-timeout 2 --max-time 3 -fsS http://status-service:8080 && echo OK || echo ERROR; sleep 5; done"]
