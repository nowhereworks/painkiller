      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "report-web",
        "namespace": "immutable-workloads"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "report-web"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "report-web"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "report-web",
                "image": "nginx:1.28-alpine",
                "imagePullPolicy": "IfNotPresent",
                "volumeMounts": [
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  },
                  {
                    "name": "log",
                    "mountPath": "/var/log"
                  },
                  {
                    "name": "cache",
                    "mountPath": "/var/cache/nginx"
                  },
                  {
                    "name": "run",
                    "mountPath": "/var/run"
                  }
                ],
                "command": [
                  "sh",
                  "-c",
                  "mkdir -p /var/log/nginx; exec nginx -g 'daemon off;'"
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 80
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "tmp",
                "emptyDir": {}
              },
              {
                "name": "log",
                "emptyDir": {}
              },
              {
                "name": "cache",
                "emptyDir": {}
              },
              {
                "name": "run",
                "emptyDir": {}
              }
            ]
          }
        }
      }
