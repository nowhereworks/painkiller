apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
spec:
  sync:
    syncOnly: []
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: {name: opaauditlabels}
spec:
  crd:
    spec:
      names: {kind: OPAAuditLabels}
      validation:
        openAPIV3Schema:
          type: object
          properties:
            labels:
              type: array
              items: {type: string}
  targets:
  - target: admission.k8s.gatekeeper.sh
    code:
    - engine: Rego
      source:
        version: v1
        rego: |
          package opaauditlabels
          violation contains {"msg": sprintf("missing label %s", [key])} if {
            some key in input.parameters.labels
            object.get(object.get(input.review.object.metadata, "labels", {}), key, "") == ""
          }
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: {name: opanamespaceteam}
spec:
  crd:
    spec:
      names: {kind: OPANamespaceTeam}
      validation:
        openAPIV3Schema: {type: object}
  targets:
  - target: admission.k8s.gatekeeper.sh
    code:
    - engine: Rego
      source:
        version: v1
        rego: |
          package opanamespaceteam
          valid_team if {
            ns := data.inventory.cluster["v1"].Namespace[input.review.namespace]
            team := ns.metadata.labels.team
            is_string(team)
            team != ""
            input.review.object.metadata.labels.team == team
          }
          violation contains {"msg": "team must match synchronized Namespace"} if not valid_team
