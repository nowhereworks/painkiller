services:
  squid-proxy:
    build: .
    ports:
      - "3128:3128"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - squid-cache:/var/spool/squid
      - squid-logs:/var/log/squid
    restart: unless-stopped
    networks:
      - management

volumes:
  squid-cache:
  squid-logs:

networks:
  management:
    external: true
