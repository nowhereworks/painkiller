services:
  painkiller-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: painkiller
      POSTGRES_PASSWORD: painkiller
      POSTGRES_DB: painkiller
    ports:
      - "5432:5432"
    networks:
      - painkiller-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painkiller -d painkiller"]
      interval: 2s
      timeout: 5s
      retries: 20

  painkiller-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      painkiller-postgres:
        condition: service_healthy
    command: ["./migrate", "-direction", "up"]
    networks:
      - painkiller-dev
    environment:
      - DATABASE_URL=postgres://painkiller:painkiller@painkiller-postgres:5432/painkiller?sslmode=disable

  painkiller-server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      painkiller-postgres:
        condition: service_healthy
      painkiller-migrate:
        condition: service_completed_successfully
    # command: ["server"]
    # volumes:
    #   - ./config-ephemeral.yaml:/etc/painkiller/config.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - painkiller-dev
    environment:
      - DATABASE_URL=postgres://painkiller:painkiller@painkiller-postgres:5432/painkiller?sslmode=disable
      - HTTP_ADDR=:8080
      - JWT_SECRET=63c2c2b15b3a5acf1c3bb35fa5fe8c416bffd8e4611d6ff626a6b08d561f62a4
      - JWT_EXPIRY=86400
      - STRIPE_SECRET_KEY=sk_test_...
      - STRIPE_WEBHOOK_SECRET=whsec_...
      - STRIPE_SUCCESS_URL=http://localhost:3000/success
      - STRIPE_CANCEL_URL=http://localhost:3000/cancel
      - PROVIDER=proxmox
      - PROXMOX_URL=${PROXMOX_URL}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}
      - PROXMOX_NODE=${PROXMOX_NODE}
      - PROXMOX_STORAGE_POOL=local-lvm
      - PROXMOX_NETWORK_BRIDGE=vmbr0
      - PROXMOX_SKIP_TLS_VERIFY=true
      - PROXMOX_TEMPLATES=workstation=9010,kubeadm-control-plane=9010,kubeadm-worker=9010
      - PROVISIONER_MODE=none
      - SCENARIO_REPO_PATH=/app/scenarios
      - LOG_LEVEL=DEBUG
      - PROXY_ADDR=${PROXY_ADDR}
      - PROXY_ALLOWED_DOMAINS=kubernetes.io,k8s.io,helm.sh,docs.docker.com

networks:
  painkiller-dev:
    driver: bridge
