<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painkiller Shell</title><link rel="stylesheet" href="/vendor/xterm.css"><link rel="stylesheet" href="/vendor/prism.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Painkiller Shell</strong><span id="phase"></span><button id="submit" hidden>Submit exam</button></header>
<main>
<section id="home"><h1>Practice tests</h1><label for="test-select">Test</label><select id="test-select" disabled><option value="">Loading tests…</option></select><p id="test-description"></p><p>One timed attempt on your private lab. Provisioning may take several minutes. Reset the lab before choosing another test.</p><p id="message"></p><div id="log" aria-label="Lab operation log" hidden></div><div class="lab-actions"><button id="prepare" disabled>Prepare lab</button> <button id="start">Start exam</button> <button id="retry">Retry operation</button> <button id="reset">Destroy lab / reset</button></div></section>
<div id="exam" hidden>
<aside id="question-panel" aria-label="Questions">
<div id="time-progress" role="progressbar" aria-label="Exam time remaining" aria-valuemin="0" aria-valuemax="100"><div id="time-fill"></div><span id="timer"></span></div>
<nav id="nav" aria-label="Question navigation"><button id="previous" aria-label="Previous question">&lt;</button><select id="question-select" aria-label="Go to question"></select><button id="next" aria-label="Next question">&gt;</button></nav>
<article><h2 id="title"></h2><div id="instructions"></div><button id="reveal" aria-expanded="false" aria-controls="solution">Reveal Instructions</button><section id="solution" aria-label="Step-by-step solution" hidden></section><label><input type="checkbox" id="flag"> Flag for review</label><label><input type="checkbox" id="done"> Mark complete</label></article>
</aside>
<div id="panel-divider" role="separator" tabindex="0" aria-label="Resize question panel" aria-orientation="vertical" aria-controls="question-panel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"></div>
<section id="terminal-panel"><div class="terminal-header">Terminal <button id="reconnect">Reconnect</button></div><div id="terminal"></div></section>
</div><section id="results" hidden></section>
</main>
<script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script><script src="/vendor/marked.js"></script><script src="/vendor/purify.js"></script><script>window.Prism={manual:true};</script><script src="/vendor/prism.js"></script><script src="/vendor/prism-bash.js"></script><script src="/vendor/prism-yaml.js"></script><script src="/vendor/prism-json.js"></script><script src="app.js"></script>
</body></html>
