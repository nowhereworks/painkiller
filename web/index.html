<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painkiller</title>
    <link rel="stylesheet" href="/vendor/xterm.css">
    <link rel="stylesheet" href="/vendor/prism.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><img src="painkiller-pill-left-40px-tall.png" alt="Painkiller" height="26"><div id="phase" aria-label="Exam status"><span id="phase-exam" hidden></span><span id="phase-status"></span><span id="phase-mode" hidden></span></div><button
            id="submit" hidden>Submit exam</button></header>
    <main>
        <section id="home">
            <div class="home-heading"><h1>Practice tests</h1><p>Choose a test and prepare your lab.</p></div>
            <div class="test-options">
                <div class="test-field"><label for="test-select">Test</label><select id="test-select" disabled>
                    <option value="">Loading tests…</option>
                </select><p id="test-description"></p></div>
                <div class="mode-field"><label for="mode-select">Mode</label><select id="mode-select">
                    <option value="simulation">Simulation</option>
                    <option value="learning">Learning</option>
                </select><p id="mode-description"></p></div>
            </div>
            <div class="lab-actions"><button id="prepare" disabled>Prepare lab</button> <button id="start" hidden>Start
                    exam</button> <button id="retry" hidden>Retry operation</button> <button id="reset" hidden>Destroy lab</button></div>
            <p id="message" role="status" aria-live="polite"></p>
            <div id="log-heading" hidden>Lab activity</div>
            <div id="log" aria-label="Lab operation log" hidden></div>
        </section>
        <div id="exam" hidden>
            <aside id="question-panel" aria-label="Questions">
                <div id="time-progress" role="progressbar" aria-label="Exam time remaining" aria-valuemin="0"
                    aria-valuemax="100">
                    <div id="time-fill"></div><span id="timer"></span>
                </div>
                <nav id="nav" aria-label="Question navigation"><button id="previous"
                        aria-label="Previous question">&lt;</button><select id="question-select"
                        aria-label="Go to question"></select><button id="next" aria-label="Next question">&gt;</button>
                </nav>
                <article>
                    <div class="question-heading">
                        <div class="question-title-row">
                            <h2 id="title"></h2><span id="question-points"></span>
                        </div>
                        <p id="question-meta"></p>
                    </div>
                    <div id="instructions"></div>
                    <div class="question-actions"><button id="verify" hidden>Verify</button><button id="reveal"
                            aria-expanded="false" aria-controls="solution">Reveal Instructions</button></div>
                    <section id="verification" aria-live="polite"></section>
                    <section id="solution" aria-label="Step-by-step solution" hidden></section>
                    <div class="question-marks"><label><input type="checkbox" id="flag"> Flag for
                            review</label><label><input type="checkbox" id="done"> <span id="done-label">Mark
                                complete</span></label></div>
                </article>
            </aside>
            <div id="panel-divider" role="separator" tabindex="0" aria-label="Resize question panel"
                aria-orientation="vertical" aria-controls="question-panel" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="40"></div>
            <section id="terminal-panel">
                <div class="terminal-header">Terminal <button id="reconnect">Reconnect</button></div>
                <div id="terminal"></div>
            </section>
        </div>
        <section id="results" hidden></section>
    </main>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script>window.Prism = { manual: true };</script>
    <script src="/vendor/prism.js"></script>
    <script src="/vendor/prism-bash.js"></script>
    <script src="/vendor/prism-yaml.js"></script>
    <script src="/vendor/prism-json.js"></script>
    <script src="app.js"></script>
</body>

</html>
